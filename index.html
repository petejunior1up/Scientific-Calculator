<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <div class="brand-text">
      <h1>SCIENTIFIC CALC</h1>
      <p>advanced scientific & complex calculator</p>
    </div>
  </div>
</header>

<main class="layout">

  <!-- ===================== CALCULATOR PANEL ===================== -->
  <section class="panel calculator" aria-label="Calculator">

    <div class="display" id="display">
      <div class="display-expr" id="expr" aria-live="polite">0</div>
      <div class="display-result" id="result"></div>
    </div>

    <div class="keypad" id="keypad">
      <!-- row 1: functions -->
      <button class="key key--fn key--fn-toggle" data-action="toggleFn" aria-expanded="false" aria-controls="fnPanel">ƒ(x)</button>
      <button class="key" data-action="insert" data-value="(">(</button>
      <button class="key" data-action="insert" data-value=")">)</button>
      <button class="key key--fn" data-action="clear">C</button>
      <button class="key key--fn" data-action="back" aria-label="Backspace">⌫</button>

      <!-- row 2 -->
      <button class="key key--imag" data-action="insert" data-value="i">i</button>
      <button class="key" data-action="insert" data-value="pi">π</button>
      <button class="key" data-action="insert" data-value="e">e</button>
      <button class="key key--op" data-action="insert" data-value="^">^</button>
      <button class="key key--op" data-action="insert" data-value="/">÷</button>

      <!-- row 3 -->
      <button class="key" data-action="insert" data-value="7">7</button>
      <button class="key" data-action="insert" data-value="8">8</button>
      <button class="key" data-action="insert" data-value="9">9</button>
      <button class="key key--op" data-action="insert" data-value="*">×</button>
      <button class="key key--op" data-action="insert" data-value="-">−</button>

      <!-- row 4 -->
      <button class="key" data-action="insert" data-value="4">4</button>
      <button class="key" data-action="insert" data-value="5">5</button>
      <button class="key" data-action="insert" data-value="6">6</button>
      <button class="key key--op" data-action="insert" data-value="+">+</button>
      <button class="key key--eq" data-action="equals" rowspan="2">=</button>

      <!-- row 5 -->
      <button class="key" data-action="insert" data-value="1">1</button>
      <button class="key" data-action="insert" data-value="2">2</button>
      <button class="key" data-action="insert" data-value="3">3</button>
      <button class="key" data-action="insert" data-value="0">0</button>
      <button class="key" data-action="insert" data-value=".">.</button>
    </div>

    <div class="fn-panel" id="fnPanel" hidden></div>

    <p class="hint">Type expressions like <code>3+4i</code>, <code>(2-i)*(1+3i)</code>, or <code>sqrt(-1)</code>. Tap <strong>ƒ(x)</strong> for the full function list. Physical keyboard works too — Enter to evaluate, Esc to clear.</p>
  </section>

</main>

<footer class="site-footer">
  <p>scientific · complex · keyboard ready</p>
</footer>

<script src="script.js"></script>
</body>
</html>
